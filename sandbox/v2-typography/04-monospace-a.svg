<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Project Atlas — Monospace A</title>
  <!-- Background -->
  <rect width="512" height="512" fill="#0A1628" rx="64"/>

  <!-- Terminal cursor blink line -->
  <rect x="370" y="100" width="3" height="28" fill="#00D4AA" opacity="0.4"/>

  <!--
    Monospace A — uniform stroke width, squared proportions,
    flat top, code-editor aesthetic. The dev tool identity.
  -->
  <g fill="none" stroke="#00D4AA" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Flat top -->
    <line x1="192" y1="108" x2="320" y2="108"/>
    <!-- Left leg -->
    <line x1="192" y1="108" x2="140" y2="404"/>
    <!-- Right leg -->
    <line x1="320" y1="108" x2="372" y2="404"/>
    <!-- Crossbar -->
    <line x1="162" y1="280" x2="350" y2="280"/>
  </g>

  <!-- Grid reference -->
  <g fill="#00D4AA" font-family="monospace" font-size="11" opacity="0.3">
    <text x="88" y="108">01</text>
    <text x="88" y="280">07</text>
    <text x="88" y="404">12</text>
  </g>

  <!-- Apex markers at top corners -->
  <circle cx="192" cy="108" r="5" fill="#FF6B35"/>
  <circle cx="320" cy="108" r="5" fill="#FF6B35"/>
</svg>
