<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Project Atlas — Hairline A</title>
  <!-- Background -->
  <rect width="512" height="512" fill="#0A1628" rx="64"/>

  <!-- Dense grid — the map itself -->
  <g stroke="#00D4AA" stroke-width="0.3" opacity="0.08">
    <line x1="56" y1="96" x2="456" y2="96"/>
    <line x1="56" y1="136" x2="456" y2="136"/>
    <line x1="56" y1="176" x2="456" y2="176"/>
    <line x1="56" y1="216" x2="456" y2="216"/>
    <line x1="56" y1="256" x2="456" y2="256"/>
    <line x1="56" y1="296" x2="456" y2="296"/>
    <line x1="56" y1="336" x2="456" y2="336"/>
    <line x1="56" y1="376" x2="456" y2="376"/>
    <line x1="56" y1="416" x2="456" y2="416"/>
    <line x1="96" y1="56" x2="96" y2="456"/>
    <line x1="176" y1="56" x2="176" y2="456"/>
    <line x1="256" y1="56" x2="256" y2="456"/>
    <line x1="336" y1="56" x2="336" y2="456"/>
    <line x1="416" y1="56" x2="416" y2="456"/>
  </g>

  <!--
    Hairline A — ultra-thin strokes, precision cartography.
    Engraved / copper-plate feel.
  -->
  <g fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-linecap="round">
    <line x1="140" y1="412" x2="256" y2="100"/>
    <line x1="372" y1="412" x2="256" y2="100"/>
    <line x1="176" y1="316" x2="336" y2="316"/>
  </g>

  <!-- Fine apex marker -->
  <circle cx="256" cy="100" r="4" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
  <circle cx="256" cy="100" r="1.5" fill="#FF6B35"/>
</svg>
