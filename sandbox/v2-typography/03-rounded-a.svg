<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Project Atlas — Rounded A</title>
  <!-- Background -->
  <rect width="512" height="512" fill="#0A1628" rx="64"/>

  <!-- Contour rings -->
  <g fill="none" stroke="#00D4AA" stroke-width="1" opacity="0.12">
    <ellipse cx="256" cy="320" rx="190" ry="76"/>
    <ellipse cx="256" cy="290" rx="140" ry="56"/>
  </g>

  <!--
    Rounded A — soft terminals, thick strokes, friendly but precise.
    Think: modern geometric sans with rounded caps.
  -->
  <g fill="none" stroke="#00D4AA" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left leg -->
    <line x1="150" y1="400" x2="256" y2="120"/>
    <!-- Right leg -->
    <line x1="362" y1="400" x2="256" y2="120"/>
  </g>
  <!-- Crossbar (separate so it overlaps cleanly) -->
  <line x1="182" y1="310" x2="330" y2="310"
    stroke="#00D4AA" stroke-width="36" stroke-linecap="round"/>
  <!-- Cut out counter (the triangle hole) -->
  <polygon points="256,168 210,296 302,296" fill="#0A1628"/>

  <!-- Apex marker -->
  <circle cx="256" cy="108" r="7" fill="#FF6B35"/>
</svg>
