<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Project Atlas — Slab Serif A</title>
  <!-- Background -->
  <rect width="512" height="512" fill="#0A1628" rx="64"/>

  <!-- Sight lines -->
  <g opacity="0.2" stroke="#00D4AA" stroke-width="1" fill="none">
    <line x1="256" y1="60" x2="256" y2="460" stroke-dasharray="4 8"/>
    <line x1="60" y1="300" x2="452" y2="300" stroke-dasharray="4 8"/>
  </g>

  <!-- Slab Serif A — heavy serifs, industrial cartography feel -->
  <g fill="#00D4AA">
    <!-- Left leg -->
    <polygon points="256,96 130,400 180,400 256,180"/>
    <!-- Right leg -->
    <polygon points="256,96 382,400 332,400 256,180"/>
    <!-- Crossbar -->
    <rect x="172" y="300" width="168" height="32" rx="0"/>
    <!-- Bottom left serif -->
    <rect x="110" y="388" width="90" height="24" rx="0"/>
    <!-- Bottom right serif -->
    <rect x="312" y="388" width="90" height="24" rx="0"/>
    <!-- Top serif / capstone -->
    <rect x="224" y="84" width="64" height="20" rx="0"/>
  </g>

  <!-- Apex marker -->
  <circle cx="256" cy="76" r="6" fill="#FF6B35"/>
  <circle cx="256" cy="76" r="11" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
</svg>
