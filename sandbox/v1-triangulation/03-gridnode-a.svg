<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Project Atlas — Grid Node A</title>

  <!-- Background -->
  <rect width="512" height="512" fill="#0A1628" rx="64"/>

  <!-- Coordinate grid -->
  <g stroke="#00D4AA" stroke-width="0.5" opacity="0.15">
    <line x1="96" y1="64" x2="96" y2="448"/>
    <line x1="176" y1="64" x2="176" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="336" y1="64" x2="336" y2="448"/>
    <line x1="416" y1="64" x2="416" y2="448"/>
    <line x1="64" y1="96" x2="448" y2="96"/>
    <line x1="64" y1="176" x2="448" y2="176"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="336" x2="448" y2="336"/>
    <line x1="64" y1="416" x2="448" y2="416"/>
  </g>

  <!-- Grid intersection dots -->
  <g fill="#00D4AA" opacity="0.2">
    <circle cx="96" cy="96" r="2"/><circle cx="176" cy="96" r="2"/>
    <circle cx="256" cy="96" r="2"/><circle cx="336" cy="96" r="2"/>
    <circle cx="416" cy="96" r="2"/><circle cx="96" cy="176" r="2"/>
    <circle cx="176" cy="176" r="2"/><circle cx="336" cy="176" r="2"/>
    <circle cx="416" cy="176" r="2"/><circle cx="96" cy="256" r="2"/>
    <circle cx="416" cy="256" r="2"/><circle cx="96" cy="336" r="2"/>
    <circle cx="416" cy="336" r="2"/><circle cx="96" cy="416" r="2"/>
    <circle cx="176" cy="416" r="2"/><circle cx="256" cy="416" r="2"/>
    <circle cx="336" cy="416" r="2"/><circle cx="416" cy="416" r="2"/>
  </g>

  <!-- The A — snapped to grid, constructed from nodes -->
  <g fill="#00D4AA">
    <!-- Left leg (thick stroke as polygon) -->
    <polygon points="256,96 152,416 192,416 256,176"/>
    <!-- Right leg -->
    <polygon points="256,96 360,416 320,416 256,176"/>
    <!-- Crossbar -->
    <rect x="186" y="304" width="140" height="28" rx="2"/>
  </g>

  <!-- Active node markers at vertices -->
  <g fill="#FF6B35">
    <circle cx="256" cy="96" r="6"/>
    <circle cx="152" cy="416" r="4"/>
    <circle cx="360" cy="416" r="4"/>
  </g>

  <!-- Coordinate labels -->
  <g fill="#00D4AA" font-family="monospace" font-size="11" opacity="0.4">
    <text x="262" y="88">0,0</text>
    <text x="362" y="432">1,1</text>
  </g>
</svg>
