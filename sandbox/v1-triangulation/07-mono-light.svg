<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Project Atlas — Monochrome on Light</title>

  <!-- Light background -->
  <rect width="512" height="512" fill="#F4F1ED" rx="64"/>

  <!-- Sight lines -->
  <g opacity="0.1" stroke="#0A1628" stroke-width="1.5">
    <line x1="60" y1="440" x2="256" y2="100"/>
    <line x1="452" y1="440" x2="256" y2="100"/>
    <line x1="256" y1="60" x2="256" y2="460" stroke-dasharray="4 8"/>
  </g>

  <!-- The A — single colour -->
  <g fill="#0A1628">
    <polygon points="256,108 148,404 188,404 256,188"/>
    <polygon points="256,108 364,404 324,404 256,188"/>
    <rect x="182" y="310" width="148" height="32" rx="2"/>
  </g>

  <!-- Survey point at apex -->
  <circle cx="256" cy="100" r="8" fill="#0A1628"/>
  <circle cx="256" cy="100" r="14" fill="none" stroke="#0A1628" stroke-width="2"/>
</svg>
